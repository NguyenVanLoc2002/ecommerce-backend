spring.application.name=ecommerce-platform
spring.profiles.active=dev

# Accept lowercase / mixed-case enum values in JSON request bodies
# (e.g., {"status": "active"} -> ACTIVE). Preserves existing client behavior.
spring.jackson.mapper.accept-case-insensitive-enums=true

# Catalog images use direct browser PUTs to R2; multipart remains capped as a defense-in-depth limit.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Cloudflare R2 catalog storage. Secrets are supplied only through environment variables.
app.storage.r2.enabled=${APP_STORAGE_R2_ENABLED:false}
app.storage.r2.endpoint=${APP_STORAGE_R2_ENDPOINT:}
app.storage.r2.access-key-id=${APP_STORAGE_R2_ACCESS_KEY_ID:}
app.storage.r2.secret-access-key=${APP_STORAGE_R2_SECRET_ACCESS_KEY:}
app.storage.r2.bucket=${APP_STORAGE_R2_BUCKET:}
app.storage.r2.region=${APP_STORAGE_R2_REGION:auto}
app.storage.r2.public-base-url=${APP_STORAGE_R2_PUBLIC_BASE_URL:}
app.storage.r2.catalog-prefix=${APP_STORAGE_R2_CATALOG_PREFIX:catalog/products}
app.storage.r2.max-image-size-bytes=${APP_STORAGE_R2_MAX_IMAGE_SIZE_BYTES:10485760}
app.storage.r2.presign-expiry-seconds=${APP_STORAGE_R2_PRESIGN_EXPIRY_SECONDS:300}
app.storage.r2.orphan-retention-hours=${APP_STORAGE_R2_ORPHAN_RETENTION_HOURS:24}
app.storage.r2.cleanup-fixed-delay-ms=${APP_STORAGE_R2_CLEANUP_FIXED_DELAY_MS:300000}
